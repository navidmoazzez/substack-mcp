name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  smoke:
    # The build passing says nothing about whether the server actually starts
    # and lists its tools, which is the failure a user would actually hit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Server starts and lists every tool
        env:
          SUBSTACK_PUBLICATION_URL: example.substack.com
          SUBSTACK_SESSION_TOKEN: ci-placeholder
          SUBSTACK_MCP_HOME: /tmp/substack-mcp-ci
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const listed = raw.trim().split("\n")
                  .map(l => JSON.parse(l))
                  .find(m => m.id === 2);
                const count = listed?.result?.tools?.length ?? 0;
                console.log(`tools: ${count}`);
                if (count !== 63) {
                  console.error(`expected 63 tools, got ${count}`);
                  process.exit(1);
                }
                const unannotated = listed.result.tools.filter(
                  t => t.annotations?.readOnlyHint === undefined
                );
                if (unannotated.length) {
                  console.error("unannotated: " + unannotated.map(t => t.name).join(", "));
                  process.exit(1);
                }
              });
            '
      - name: Read-only mode hides every write
        env:
          SUBSTACK_PUBLICATION_URL: example.substack.com
          SUBSTACK_SESSION_TOKEN: ci-placeholder
          SUBSTACK_READ_ONLY: "1"
          SUBSTACK_MCP_HOME: /tmp/substack-mcp-ci
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const listed = raw.trim().split("\n")
                  .map(l => JSON.parse(l))
                  .find(m => m.id === 2);
                const writes = listed.result.tools.filter(t => !t.annotations.readOnlyHint);
                if (writes.length) {
                  console.error("writes exposed in read-only mode: " + writes.map(t => t.name).join(", "));
                  process.exit(1);
                }
                console.log(`read-only tools: ${listed.result.tools.length}`);
              });
            '

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t substack-mcp:ci .
